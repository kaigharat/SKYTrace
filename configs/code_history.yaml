# SkyTrace — Experiment C: Code + History
# CodeBERT (frozen) + Proxy history features → MLP → fusion

experiment:
  name: "code_history"
  output_dir: "experiments/code_history"
  seed: 42

dataset:
  config: "dataset.yaml"
  sample_size: null              # null = full dataset

model:
  encoder:
    name: "microsoft/codebert-base"
    hidden_size: 768
    freeze_layers: 12            # Frozen — same as Exp A for fair comparison
  pooling: "mean"

  history:
    in_features: 6               # 6 proxy history features
    hidden_dims: [64, 64]
    out_dim: 64
    dropout: 0.1
    use_batchnorm: true          # Important: features have different scales

  fusion:
    hidden_dims: [256, 128]
    dropout: 0.1

  n_classes: 1

  # Load CodeBERT encoder weights from Experiment A checkpoint
  load_codebert_from: "models/checkpoints/codebert_baseline/best.pt"

tokenizer:
  max_length: 256
  truncation: true
  padding: "max_length"

history_features:
  # Proxy features derived from existing data (no external backend required)
  # commit_size, project_vuln_density, has_cwe, n_cwe_types,
  # function_name_len, is_long_function
  long_function_threshold: 50
  cache_path: "experiments/code_history/history_features.npz"

training:
  batch_size: 32
  eval_batch_size: 64
  epochs: 5
  learning_rate: 1.0e-3          # Higher LR: only training history encoder + fusion
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  fp16: true
  scheduler: "linear_with_warmup"
  class_weighted_loss: true
  early_stopping:
    patience: 2
    metric: "pr_auc"
    mode: "max"
  checkpoint:
    save_dir: "models/checkpoints/code_history"
    save_best: true
    save_last: true
  log_interval: 100
  eval_interval: 1

dataloader:
  num_workers: 0
  pin_memory: false

evaluation:
  metrics: [accuracy, precision, recall, f1, roc_auc, pr_auc]
  confusion_matrix: true
  roc_curve: true
  pr_curve: true
  threshold: 0.5
