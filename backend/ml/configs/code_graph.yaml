# SkyTrace — Experiment B: Code + Graph
# CodeBERT (frozen) + GraphSAGE on co-change graph → fusion MLP

experiment:
  name: "code_graph"
  output_dir: "experiments/code_graph"
  seed: 42

dataset:
  config: "dataset.yaml"
  sample_size: null              # null = full dataset

model:
  encoder:
    name: "microsoft/codebert-base"
    hidden_size: 768
    freeze_layers: 12            # Frozen — same as Exp A for fair comparison
  pooling: "mean"

  gnn:
    hidden_channels: 256
    out_channels: 256
    num_layers: 2
    dropout: 0.1

  fusion:
    hidden_dims: [512, 256]
    dropout: 0.1

  n_classes: 1

  # Load CodeBERT encoder weights from Experiment A checkpoint
  load_codebert_from: "models/checkpoints/codebert_baseline/best.pt"

tokenizer:
  max_length: 256
  truncation: true
  padding: "max_length"

graph:
  max_commit_size: 50            # Skip mega-commits (>50 functions)
  # Pre-compute CodeBERT embeddings for graph node features
  # (same frozen encoder → same embeddings as Exp A)
  embedding_cache: "experiments/code_graph/embeddings_cache.npz"

training:
  batch_size: 64                 # Larger batches = richer graphs
  eval_batch_size: 128
  epochs: 5
  learning_rate: 1.0e-3          # Higher LR: only training GNN + fusion head
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  fp16: true
  scheduler: "linear_with_warmup"
  class_weighted_loss: true
  early_stopping:
    patience: 2
    metric: "pr_auc"
    mode: "max"
  checkpoint:
    save_dir: "models/checkpoints/code_graph"
    save_best: true
    save_last: true
  log_interval: 100
  eval_interval: 1

dataloader:
  num_workers: 0                 # Windows: keep 0 to avoid multiprocessing issues
  pin_memory: false

evaluation:
  metrics: [accuracy, precision, recall, f1, roc_auc, pr_auc]
  confusion_matrix: true
  roc_curve: true
  pr_curve: true
  threshold: 0.5
